<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#2e2e2e" />
    <meta name="description" content="Vereins-App der HSG Hinterland – Mannschaften, Dienste und Termine an einem Ort." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="HSG Hinterland" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Oswald:wght@400;600;700&display=swap"
    />

    <title>HSG Hinterland App</title>

    <!--
      Thema VOR dem ersten Bild setzen.

      Die App entscheidet über das Design im ThemeProvider – aber der läuft
      erst, wenn React geladen ist. Ohne diese vier Zeilen blitzt die Seite bei
      jedem Aufruf kurz hell auf, bevor sie dunkel wird. Gelesen wird nur die
      lokale Kopie der Einstellung; die verbindliche Quelle bleibt das
      Benutzerprofil, das der Provider danach nachzieht.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('hsg-theme');
          var dark =
            stored === 'dark' ||
            ((!stored || stored === 'system') &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) {
            document.documentElement.classList.add('dark');
            document.documentElement.dataset.theme = 'dark';
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute('content', '#111416');
          }
        } catch (err) {
          /* Speicher gesperrt – dann startet die App hell. */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
